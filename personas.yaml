# Demo personas. Mobile numbers are fake; the shared generators map each to a deterministic profile.
# `profile` drives data generation; `bureau` drives the mock bureau; `consent` is the demo's default behaviour.
personas:
  - id: 1
    key: merchant
    name: "Ramesh Gupta"
    description: "Small-town merchant — steady UPI/bank inflows, GST filings, regular recharges"
    mobile_number: "9000000001"
    pan_token: "PANMERCH01"
    aadhaar_token: "AADH-MASK-0001"
    product_sku: TWO_WHEELER
    language: en
    bureau: { status: NO_HIT, score: -1 }
    profile: { segment: merchant, creditworthiness: 0.50 }
    expected_outcome: APPROVED
