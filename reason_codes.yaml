# Feature → reason code mapping, with plain-language text and deterministic action templates (en / hi / mr).
#   positive : shown when the feature pushes the score UP
#   negative : shown when the feature pulls the score DOWN
#   action   : concrete step for the applicant when it is a drag (used by the deterministic advisory fallback)
#   reportable: false → hidden from reason lists / advice (still shown in the SHAP waterfall)
# Add or edit entries freely; code looks features up by the `feature` key.

version: "1"

reason_codes:
  RC001:
    feature: buffer_ratio
    label: { en: "Savings buffer vs EMI", hi: "EMI के मुकाबले बचत", mr: "EMI च्या तुलनेत शिल्लक" }
    positive: { en: "Strong savings buffer relative to the EMI", hi: "EMI के मुकाबले अच्छी बचत", mr: "EMI च्या तुलनेत चांगली शिल्लक" }
    negative: { en: "Low account balance relative to the EMI", hi: "EMI के मुकाबले खाते में कम बैलेंस", mr: "EMI च्या तुलनेत खात्यातील शिल्लक कमी" }
    action:
      en: "Try to keep a balance of at least 2 EMIs in your bank account at all times."
      hi: "अपने बैंक खाते में हमेशा कम से कम 2 EMI के बराबर रकम रखने की कोशिश करें।"
      mr: "तुमच्या बँक खात्यात नेहमी किमान 2 EMI इतकी रक्कम ठेवण्याचा प्रयत्न करा."
  RC002:
    feature: bounce_velocity
    label: { en: "Payment bounces", hi: "भुगतान बाउंस", mr: "पेमेंट बाउन्स" }
    positive: { en: "No recent payment bounces", hi: "हाल में कोई भुगतान बाउंस नहीं", mr: "अलीकडे कोणताही पेमेंट बाउन्स नाही" }
    negative: { en: "Recent payment bounces on the account", hi: "खाते में हाल के भुगतान बाउंस", mr: "खात्यात अलीकडील पेमेंट बाउन्स" }
    action:
      en: "Set a reminder 2 days before every EMI or auto-debit date and top up your account so no payment bounces."
      hi: "हर EMI या ऑटो-डेबिट की तारीख से 2 दिन पहले रिमाइंडर लगाएं और खाते में पैसे डालें ताकि कोई भुगतान बाउंस न हो।"
      mr: "प्रत्येक EMI किंवा ऑटो-डेबिट तारखेच्या 2 दिवस आधी स्मरणपत्र लावा आणि खात्यात पैसे भरा, म्हणजे पेमेंट बाउन्स होणार नाही."
  RC003:
    feature: income_regularity
    label: { en: "Income regularity", hi: "आय की नियमितता", mr: "उत्पन्नातील नियमितता" }
    positive: { en: "Money comes in regularly every month", hi: "हर महीने नियमित रूप से पैसा आता है", mr: "दर महिन्याला नियमितपणे पैसे येतात" }
    negative: { en: "Monthly income is uneven", hi: "मासिक आय अनियमित है", mr: "मासिक उत्पन्न असमान आहे" }
    action:
      en: "Route as much of your earnings as possible into one bank account every week so your income shows up steadily."
      hi: "अपनी कमाई का ज़्यादातर हिस्सा हर हफ्ते एक ही बैंक खाते में जमा करें ताकि आय नियमित दिखे।"
      mr: "तुमची जास्तीत जास्त कमाई दर आठवड्याला एकाच बँक खात्यात जमा करा, म्हणजे उत्पन्न नियमित दिसेल."
  RC004:
    feature: monthly_inflow_count
    label: { en: "Number of monthly credits", hi: "मासिक जमा की संख्या", mr: "मासिक जमांची संख्या" }
    positive: { en: "Frequent incoming payments", hi: "बार-बार पैसा जमा होता है", mr: "वारंवार पैसे जमा होतात" }
    negative: { en: "Few incoming payments each month", hi: "हर महीने कम बार पैसा जमा होता है", mr: "दर महिन्याला कमी वेळा पैसे जमा होतात" }
    action:
      en: "Ask customers to pay you through UPI or bank transfer instead of cash, so more of your earnings are recorded."
      hi: "ग्राहकों से नकद के बजाय UPI या बैंक ट्रांसफर से भुगतान लें, ताकि आपकी ज़्यादा कमाई दर्ज हो।"
      mr: "ग्राहकांकडून रोख ऐवजी UPI किंवा बँक ट्रान्सफरने पैसे घ्या, म्हणजे तुमची जास्त कमाई नोंदली जाईल."
  RC005:
    feature: distinct_upi_counterparties
    label: { en: "UPI customer base", hi: "UPI ग्राहक आधार", mr: "UPI ग्राहक संख्या" }
    positive: { en: "Many different people pay you via UPI", hi: "कई अलग-अलग लोग UPI से भुगतान करते हैं", mr: "अनेक वेगवेगळे लोक UPI ने पैसे देतात" }
    negative: { en: "Only a few people pay you via UPI", hi: "बहुत कम लोग UPI से भुगतान करते हैं", mr: "फार कमी लोक UPI ने पैसे देतात" }
    action:
      en: "Display a UPI QR code at your work and encourage more customers to pay digitally."
      hi: "अपने काम की जगह UPI QR कोड लगाएं और ज़्यादा ग्राहकों को डिजिटल भुगतान के लिए प्रोत्साहित करें।"
      mr: "तुमच्या कामाच्या ठिकाणी UPI QR कोड लावा आणि अधिक ग्राहकांना डिजिटल पेमेंटसाठी प्रोत्साहित करा."
  RC006:
    feature: cash_vs_digital_ratio
    reportable: false
    label: { en: "Cash share of income", hi: "आय में नकद का हिस्सा", mr: "उत्पन्नातील रोख हिस्सा" }
    positive: { en: "Healthy mix of cash and digital income", hi: "नकद और डिजिटल आय का अच्छा मेल", mr: "रोख आणि डिजिटल उत्पन्नाचा चांगला समतोल" }
    negative: { en: "A large share of income arrives in cash", hi: "आय का बड़ा हिस्सा नकद आता है", mr: "उत्पन्नाचा मोठा हिस्सा रोख येतो" }
    action: { en: "Prefer digital payments from customers.", hi: "ग्राहकों से डिजिटल भुगतान को प्राथमिकता दें।", mr: "ग्राहकांकडून डिजिटल पेमेंटला प्राधान्य द्या." }
  RC007:
    feature: digital_inflow_share
    label: { en: "Digital income share", hi: "डिजिटल आय का हिस्सा", mr: "डिजिटल उत्पन्नाचा हिस्सा" }
    positive: { en: "Most income arrives digitally", hi: "ज़्यादातर आय डिजिटल रूप से आती है", mr: "बहुतेक उत्पन्न डिजिटल पद्धतीने येते" }
    negative: { en: "Only a small share of income is digital", hi: "आय का केवल छोटा हिस्सा डिजिटल है", mr: "उत्पन्नाचा फक्त छोटा हिस्सा डिजिटल आहे" }
    action:
      en: "Move more of your day-to-day earnings to UPI and bank transfers so they appear in your bank record."
      hi: "अपनी रोज़ की कमाई का ज़्यादा हिस्सा UPI और बैंक ट्रांसफर से लें ताकि वह आपके बैंक रिकॉर्ड में दिखे।"
      mr: "तुमची रोजची कमाई जास्तीत जास्त UPI आणि बँक ट्रान्सफरने घ्या, म्हणजे ती तुमच्या बँक नोंदीत दिसेल."
  RC008:
    feature: min_balance_days
    label: { en: "Days with a very low balance", hi: "बहुत कम बैलेंस वाले दिन", mr: "खूप कमी शिल्लक असलेले दिवस" }
    positive: { en: "Account rarely runs near zero", hi: "खाता शायद ही कभी खाली होता है", mr: "खाते क्वचितच जवळजवळ रिकामे होते" }
    negative: { en: "Account often runs close to zero", hi: "खाता अक्सर लगभग खाली रहता है", mr: "खाते अनेकदा जवळजवळ रिकामे असते" }
    action:
      en: "Avoid letting your balance fall below ₹500 — move a small amount into the account every time money comes in."
      hi: "खाते का बैलेंस ₹500 से नीचे न जाने दें — जब भी पैसे आएं, थोड़ी रकम खाते में रखें।"
      mr: "खात्यातील शिल्लक ₹500 पेक्षा खाली जाऊ देऊ नका — पैसे आले की थोडी रक्कम खात्यात ठेवा."
  RC009:
    feature: balance_trend
    label: { en: "Balance trend", hi: "बैलेंस का रुझान", mr: "शिल्लकीचा कल" }
    positive: { en: "Account balance is growing over time", hi: "खाते का बैलेंस समय के साथ बढ़ रहा है", mr: "खात्यातील शिल्लक कालांतराने वाढत आहे" }
    negative: { en: "Account balance is shrinking over time", hi: "खाते का बैलेंस समय के साथ घट रहा है", mr: "खात्यातील शिल्लक कालांतराने कमी होत आहे" }
    action:
      en: "Put aside a fixed small amount each week as savings so your balance grows month after month."
      hi: "हर हफ्ते एक तय छोटी रकम बचत के रूप में अलग रखें ताकि बैलेंस महीने दर महीने बढ़े।"
      mr: "दर आठवड्याला ठराविक छोटी रक्कम बचत म्हणून बाजूला ठेवा, म्हणजे शिल्लक महिन्यानुमहिना वाढेल."
  RC010:
    feature: avg_monthly_inflow
    label: { en: "Monthly money coming in", hi: "मासिक आमदनी", mr: "मासिक आवक" }
    positive: { en: "Good monthly inflow into the account", hi: "खाते में अच्छी मासिक आमदनी", mr: "खात्यात चांगली मासिक आवक" }
    negative: { en: "Low monthly inflow into the account", hi: "खाते में कम मासिक आमदनी", mr: "खात्यात कमी मासिक आवक" }
    action:
      en: "Bring all your income through the bank account — even small amounts add up and show your true earnings."
      hi: "अपनी पूरी आमदनी बैंक खाते से लें — छोटी रकम भी जुड़कर आपकी असली कमाई दिखाती है।"
      mr: "तुमचे संपूर्ण उत्पन्न बँक खात्यातून घ्या — लहान रक्कमही मिळून तुमची खरी कमाई दाखवते."
  RC011:
    feature: max_monthly_outflow
    reportable: false
    label: { en: "Peak monthly spending", hi: "अधिकतम मासिक खर्च", mr: "कमाल मासिक खर्च" }
    positive: { en: "Spending is well within income", hi: "खर्च आय के भीतर है", mr: "खर्च उत्पन्नाच्या मर्यादेत आहे" }
    negative: { en: "A very high spending month", hi: "एक महीने में बहुत ज़्यादा खर्च", mr: "एका महिन्यात खूप जास्त खर्च" }
    action: { en: "Plan big expenses ahead so they do not drain your account.", hi: "बड़े खर्चों की पहले से योजना बनाएं।", mr: "मोठ्या खर्चांचे आधीच नियोजन करा." }
  RC012:
    feature: salary_regularity
    label: { en: "Regular large credits", hi: "नियमित बड़ी जमा", mr: "नियमित मोठ्या जमा" }
    positive: { en: "Large credits arrive on a regular schedule", hi: "बड़ी रकम नियमित समय पर आती है", mr: "मोठी रक्कम नियमित वेळेवर येते" }
    negative: { en: "No regular large credit pattern", hi: "बड़ी रकम आने का कोई नियमित पैटर्न नहीं", mr: "मोठी रक्कम येण्याचा नियमित पॅटर्न नाही" }
    action:
      en: "Try to receive your main earnings on a fixed day each month, for example by agreeing a payment date with your main client."
      hi: "अपनी मुख्य कमाई हर महीने एक तय तारीख पर पाने की कोशिश करें, जैसे अपने मुख्य ग्राहक से भुगतान की तारीख तय करके।"
      mr: "तुमची मुख्य कमाई दर महिन्याला ठराविक तारखेला मिळवण्याचा प्रयत्न करा, उदा. मुख्य ग्राहकाशी पेमेंटची तारीख ठरवून."
  RC013:
    feature: upi_txn_frequency
    reportable: false
    label: { en: "UPI activity", hi: "UPI गतिविधि", mr: "UPI व्यवहार" }
    positive: { en: "Active UPI usage", hi: "UPI का सक्रिय उपयोग", mr: "UPI चा सक्रिय वापर" }
    negative: { en: "Limited UPI usage", hi: "UPI का सीमित उपयोग", mr: "UPI चा मर्यादित वापर" }
    action: { en: "Use UPI for everyday payments.", hi: "रोज़ के भुगतान UPI से करें।", mr: "रोजचे पेमेंट UPI ने करा." }
  RC014:
    feature: balance_volatility
    label: { en: "Balance ups and downs", hi: "बैलेंस में उतार-चढ़ाव", mr: "शिल्लकीतील चढ-उतार" }
    positive: { en: "Account balance is stable", hi: "खाते का बैलेंस स्थिर है", mr: "खात्यातील शिल्लक स्थिर आहे" }
    negative: { en: "Account balance swings sharply", hi: "खाते के बैलेंस में तेज़ उतार-चढ़ाव है", mr: "खात्यातील शिल्लकीत मोठे चढ-उतार आहेत" }
    action:
      en: "Spread large expenses over the month and keep a small cushion in your account so the balance stays steady."
      hi: "बड़े खर्चों को महीने भर में बाँटें और खाते में थोड़ी रकम बफर के रूप में रखें ताकि बैलेंस स्थिर रहे।"
      mr: "मोठे खर्च महिनाभरात विभागून करा आणि खात्यात थोडी रक्कम राखीव ठेवा, म्हणजे शिल्लक स्थिर राहील."
  RC015:
    feature: recharge_frequency_regularity
    label: { en: "Mobile recharge regularity", hi: "मोबाइल रिचार्ज की नियमितता", mr: "मोबाइल रिचार्जची नियमितता" }
    positive: { en: "Consistent mobile recharge pattern", hi: "मोबाइल रिचार्ज का नियमित पैटर्न", mr: "मोबाइल रिचार्जचा नियमित पॅटर्न" }
    negative: { en: "Irregular mobile recharges", hi: "मोबाइल रिचार्ज अनियमित हैं", mr: "मोबाइल रिचार्ज अनियमित आहेत" }
    action:
      en: "Recharge your phone on a regular schedule — for example the same date every month — and avoid long gaps."
      hi: "अपना फोन नियमित रूप से रिचार्ज करें — जैसे हर महीने एक ही तारीख को — और लंबा अंतराल न आने दें।"
      mr: "तुमचा फोन नियमितपणे रिचार्ज करा — उदा. दर महिन्याच्या एकाच तारखेला — आणि मोठा खंड पडू देऊ नका."
  RC016:
    feature: recharge_count_12m
    label: { en: "Recharges in the last year", hi: "पिछले साल के रिचार्ज", mr: "गेल्या वर्षातील रिचार्ज" }
    positive: { en: "Frequent recharges over the past year", hi: "पिछले साल नियमित रिचार्ज", mr: "गेल्या वर्षभरात नियमित रिचार्ज" }
    negative: { en: "Few recharges over the past year", hi: "पिछले साल कम रिचार्ज", mr: "गेल्या वर्षभरात कमी रिचार्ज" }
    action:
      en: "Choose a monthly plan and renew it on time every month instead of occasional top-ups."
      hi: "कभी-कभार टॉप-अप के बजाय मासिक प्लान लें और हर महीने समय पर रिन्यू करें।"
      mr: "अधूनमधून टॉप-अप करण्याऐवजी मासिक प्लॅन घ्या आणि दर महिन्याला वेळेवर रिन्यू करा."
  RC017:
    feature: avg_recharge_value
    label: { en: "Recharge amount", hi: "रिचार्ज की राशि", mr: "रिचार्जची रक्कम" }
    positive: { en: "Healthy recharge amounts", hi: "रिचार्ज की अच्छी राशि", mr: "रिचार्जची चांगली रक्कम" }
    negative: { en: "Small recharge amounts", hi: "रिचार्ज की राशि कम है", mr: "रिचार्जची रक्कम कमी आहे" }
    action:
      en: "Moving to a regular monthly plan, even a small one, shows steady use of your mobile connection."
      hi: "नियमित मासिक प्लान (छोटा ही सही) लेने से आपके मोबाइल कनेक्शन का स्थिर उपयोग दिखता है।"
      mr: "नियमित मासिक प्लॅन (लहान का असेना) घेतल्याने तुमच्या मोबाइल कनेक्शनचा स्थिर वापर दिसतो."
  RC018:
    feature: recharge_value_trend
    reportable: false
    label: { en: "Recharge amount trend", hi: "रिचार्ज राशि का रुझान", mr: "रिचार्ज रकमेचा कल" }
    positive: { en: "Recharge amounts are rising", hi: "रिचार्ज की राशि बढ़ रही है", mr: "रिचार्जची रक्कम वाढत आहे" }
    negative: { en: "Recharge amounts are falling", hi: "रिचार्ज की राशि घट रही है", mr: "रिचार्जची रक्कम कमी होत आहे" }
    action: { en: "Keep your recharge plan steady.", hi: "अपना रिचार्ज प्लान स्थिर रखें।", mr: "तुमचा रिचार्ज प्लॅन स्थिर ठेवा." }
  RC019:
    feature: sim_tenure_months
    label: { en: "How long you have used your SIM", hi: "SIM का पुराना उपयोग", mr: "SIM चा जुना वापर" }
    positive: { en: "Long-standing mobile connection", hi: "लंबे समय से चल रहा मोबाइल कनेक्शन", mr: "दीर्घकाळापासूनचे मोबाइल कनेक्शन" }
    negative: { en: "Fairly new mobile connection", hi: "मोबाइल कनेक्शन अपेक्षाकृत नया है", mr: "मोबाइल कनेक्शन तुलनेने नवे आहे" }
    action:
      en: "Keep using the same mobile number for all your bank and business dealings — a long-running number builds trust."
      hi: "अपने सभी बैंक और व्यापार के कामों में एक ही मोबाइल नंबर इस्तेमाल करें — पुराना नंबर भरोसा बनाता है।"
      mr: "तुमच्या सर्व बँक आणि व्यवसायाच्या कामांसाठी एकच मोबाइल नंबर वापरा — जुना नंबर विश्वास निर्माण करतो."
  RC020:
    feature: max_recharge_gap_days
    label: { en: "Longest gap without recharge", hi: "रिचार्ज के बिना सबसे लंबा अंतराल", mr: "रिचार्जशिवायचा सर्वात मोठा खंड" }
    positive: { en: "No long gaps between recharges", hi: "रिचार्ज के बीच लंबा अंतराल नहीं", mr: "रिचार्जमध्ये मोठा खंड नाही" }
    negative: { en: "Long gaps between recharges", hi: "रिचार्ज के बीच लंबे अंतराल", mr: "रिचार्जमध्ये मोठे खंड" }
    action:
      en: "Do not let your phone plan run out — recharge a few days before it expires."
      hi: "अपना फोन प्लान खत्म न होने दें — खत्म होने से कुछ दिन पहले रिचार्ज करें।"
      mr: "तुमचा फोन प्लॅन संपू देऊ नका — संपण्याच्या काही दिवस आधी रिचार्ज करा."
  RC021:
    feature: gst_avg_turnover
    label: { en: "Business turnover", hi: "व्यापार का टर्नओवर", mr: "व्यवसायाची उलाढाल" }
    positive: { en: "Healthy business turnover on GST returns", hi: "GST रिटर्न में अच्छा टर्नओवर", mr: "GST रिटर्नमध्ये चांगली उलाढाल" }
    negative: { en: "Low business turnover on GST returns", hi: "GST रिटर्न में कम टर्नओवर", mr: "GST रिटर्नमध्ये कमी उलाढाल" }
    action:
      en: "Record every sale properly and bill through your GST account so your full turnover is visible."
      hi: "हर बिक्री सही तरह से दर्ज करें और GST खाते से बिल बनाएं ताकि आपका पूरा टर्नओवर दिखे।"
      mr: "प्रत्येक विक्री व्यवस्थित नोंदवा आणि GST खात्यातून बिल करा, म्हणजे तुमची संपूर्ण उलाढाल दिसेल."
  RC022:
    feature: gst_turnover_volatility
    label: { en: "Turnover ups and downs", hi: "टर्नओवर में उतार-चढ़ाव", mr: "उलाढालीतील चढ-उतार" }
    positive: { en: "Business turnover is steady", hi: "व्यापार का टर्नओवर स्थिर है", mr: "व्यवसायाची उलाढाल स्थिर आहे" }
    negative: { en: "Business turnover swings month to month", hi: "व्यापार का टर्नओवर महीने दर महीने बदलता है", mr: "व्यवसायाची उलाढाल महिन्यानुमहिना बदलते" }
    action:
      en: "Look for regular customers or monthly contracts to make your sales steadier through the year."
      hi: "साल भर बिक्री स्थिर रखने के लिए नियमित ग्राहक या मासिक अनुबंध खोजें।"
      mr: "वर्षभर विक्री स्थिर ठेवण्यासाठी नियमित ग्राहक किंवा मासिक करार शोधा."
  RC023:
    feature: gst_filing_consistency
    label: { en: "GST filing on time", hi: "समय पर GST फाइलिंग", mr: "वेळेवर GST फाइलिंग" }
    positive: { en: "GST returns filed on time", hi: "GST रिटर्न समय पर भरे गए", mr: "GST रिटर्न वेळेवर भरले" }
    negative: { en: "GST returns filed late", hi: "GST रिटर्न देर से भरे गए", mr: "GST रिटर्न उशिरा भरले" }
    action:
      en: "File your GST return before the due date every month — set a reminder for the 15th."
      hi: "हर महीने GST रिटर्न नियत तारीख से पहले भरें — 15 तारीख का रिमाइंडर लगाएं।"
      mr: "दर महिन्याला GST रिटर्न देय तारखेपूर्वी भरा — 15 तारखेचे स्मरणपत्र लावा."
  RC024:
    feature: gst_growth_trend
    label: { en: "Business growth", hi: "व्यापार की वृद्धि", mr: "व्यवसायाची वाढ" }
    positive: { en: "Business turnover is growing", hi: "व्यापार का टर्नओवर बढ़ रहा है", mr: "व्यवसायाची उलाढाल वाढत आहे" }
    negative: { en: "Business turnover is shrinking", hi: "व्यापार का टर्नओवर घट रहा है", mr: "व्यवसायाची उलाढाल कमी होत आहे" }
    action:
      en: "Focus on your best-selling items and regular customers to bring your sales back on an upward path."
      hi: "अपनी सबसे ज़्यादा बिकने वाली चीज़ों और नियमित ग्राहकों पर ध्यान दें ताकि बिक्री फिर बढ़े।"
      mr: "तुमच्या सर्वाधिक विकल्या जाणाऱ्या वस्तू आणि नियमित ग्राहकांवर लक्ष द्या, म्हणजे विक्री पुन्हा वाढेल."
  RC025:
    feature: gst_months_filed
    label: { en: "Months of GST history", hi: "GST रिकॉर्ड के महीने", mr: "GST नोंदीचे महिने" }
    positive: { en: "Long GST filing history", hi: "GST फाइलिंग का लंबा इतिहास", mr: "GST फाइलिंगचा दीर्घ इतिहास" }
    negative: { en: "Short GST filing history", hi: "GST फाइलिंग का इतिहास छोटा है", mr: "GST फाइलिंगचा इतिहास कमी आहे" }
    action:
      en: "Keep filing your GST returns every month without a break — a longer record helps."
      hi: "बिना रुके हर महीने GST रिटर्न भरते रहें — लंबा रिकॉर्ड मदद करता है।"
      mr: "खंड न पाडता दर महिन्याला GST रिटर्न भरत रहा — दीर्घ नोंद उपयोगी ठरते."
  RC026:
    feature: mandi_settlement_frequency
    label: { en: "Mandi sales frequency", hi: "मंडी बिक्री की आवृत्ति", mr: "मंडी विक्रीची वारंवारता" }
    positive: { en: "Regular crop sales at the mandi", hi: "मंडी में नियमित फसल बिक्री", mr: "मंडीत नियमित पीक विक्री" }
    negative: { en: "Infrequent crop sales at the mandi", hi: "मंडी में फसल बिक्री कम होती है", mr: "मंडीत पीक विक्री कमी वेळा होते" }
    action:
      en: "Sell your produce through the registered mandi and keep every receipt, so your sales are on record."
      hi: "अपनी उपज पंजीकृत मंडी के माध्यम से बेचें और हर रसीद संभालकर रखें ताकि बिक्री रिकॉर्ड में रहे।"
      mr: "तुमचा शेतमाल नोंदणीकृत मंडीतून विका आणि प्रत्येक पावती जपून ठेवा, म्हणजे विक्री नोंदीत राहील."
  RC027:
    feature: mandi_distinct_cycles
    label: { en: "Harvest cycles on record", hi: "रिकॉर्ड में फसल चक्र", mr: "नोंदीतील पीक हंगाम" }
