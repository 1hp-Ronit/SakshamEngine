# Fixed wording for the advisory messages (deterministic fallback + guardrail-safe shell for the LLM output).
advisory_templates:
  greeting:
    en: "Hello {name},"
    hi: "नमस्ते {name} जी,"
    mr: "नमस्कार {name},"
  summary:
    en: "Thank you for applying for a {product} loan with TVS Credit. We could not approve it right now, but here are 3 simple steps that can strengthen your next application."
    hi: "TVS Credit से {product} लोन के लिए आवेदन करने का धन्यवाद। अभी हम इसे मंज़ूर नहीं कर सके, लेकिन ये 3 आसान कदम आपके अगले आवेदन को मज़बूत कर सकते हैं।"
    mr: "TVS Credit कडे {product} कर्जासाठी अर्ज केल्याबद्दल धन्यवाद. सध्या आम्ही तो मंजूर करू शकलो नाही, पण हे 3 सोपे उपाय तुमचा पुढील अर्ज मजबूत करू शकतात."
  closing:
    en: "Follow these steps for a few months and apply again — we are happy to look at your application again."
    hi: "कुछ महीने इन कदमों का पालन करें और फिर से आवेदन करें — हम आपके आवेदन को दोबारा देखकर खुश होंगे।"
    mr: "काही महिने या उपायांचे पालन करा आणि पुन्हा अर्ज करा — तुमचा अर्ज पुन्हा पाहण्यास आम्हाला आनंद होईल."
  approved:
    en: "Hello {name}, good news! Your {product} loan has been approved in principle. Our team will contact you shortly to complete the formalities."
    hi: "नमस्ते {name} जी, खुशखबरी! आपका {product} लोन सैद्धांतिक रूप से मंज़ूर हो गया है। औपचारिकताएं पूरी करने के लिए हमारी टीम जल्द ही आपसे संपर्क करेगी।"
    mr: "नमस्कार {name}, खुशखबर! तुमचे {product} कर्ज तत्त्वतः मंजूर झाले आहे. औपचारिकता पूर्ण करण्यासाठी आमची टीम लवकरच तुमच्याशी संपर्क साधेल."
  conditional:
    en: "Hello {name}, you are close! We can offer your {product} loan with a smaller amount (about ₹{amount}) or if you add a co-applicant. Our team will contact you to discuss."
    hi: "नमस्ते {name} जी, आप बहुत करीब हैं! हम आपका {product} लोन कम राशि (लगभग ₹{amount}) पर या सह-आवेदक जोड़ने पर दे सकते हैं। चर्चा के लिए हमारी टीम आपसे संपर्क करेगी।"
    mr: "नमस्कार {name}, तुम्ही अगदी जवळ आहात! आम्ही तुमचे {product} कर्ज कमी रकमेवर (सुमारे ₹{amount}) किंवा सह-अर्जदार जोडल्यास देऊ शकतो. चर्चेसाठी आमची टीम तुमच्याशी संपर्क साधेल."
  insufficient:
    en: "Hello {name}, we could not gather enough information to assess your {product} loan automatically. Our team will review your application manually and contact you."
    hi: "नमस्ते {name} जी, हम आपके {product} लोन का स्वचालित आकलन करने के लिए पर्याप्त जानकारी नहीं जुटा सके। हमारी टीम आपके आवेदन की मैन्युअल समीक्षा करेगी और आपसे संपर्क करेगी।"
    mr: "नमस्कार {name}, तुमच्या {product} कर्जाचे स्वयंचलित मूल्यांकन करण्यासाठी आम्हाला पुरेशी माहिती मिळाली नाही. आमची टीम तुमच्या अर्जाचे मॅन्युअल पुनरावलोकन करेल आणि तुमच्याशी संपर्क साधेल."
  consent_request:
    en: "Hello {name}, TVS Credit needs your permission to look at your bank, mobile and business records to assess your {product} loan. Please review and give consent here: {url}"
    hi: "नमस्ते {name} जी, आपके {product} लोन के आकलन के लिए TVS Credit को आपके बैंक, मोबाइल और व्यापार रिकॉर्ड देखने की आपकी अनुमति चाहिए। कृपया यहां देखें और सहमति दें: {url}"
    mr: "नमस्कार {name}, तुमच्या {product} कर्जाच्या मूल्यांकनासाठी TVS Credit ला तुमचे बँक, मोबाइल आणि व्यवसाय नोंदी पाहण्यासाठी तुमची परवानगी हवी आहे. कृपया येथे पाहून संमती द्या: {url}"
  status_update:
    en: "Hello {name}, an update on your {product} loan application is ready. View it here: {url}"
    hi: "नमस्ते {name} जी, आपके {product} लोन आवेदन का अपडेट तैयार है। यहां देखें: {url}"
    mr: "नमस्कार {name}, तुमच्या {product} कर्ज अर्जाचे अपडेट तयार आहे. येथे पहा: {url}"
  generic_step:
    en: "Keep up your regular banking, UPI and mobile recharge habits for the next few months — steady habits build trust."
    hi: "अगले कुछ महीनों तक अपनी बैंकिंग, UPI और मोबाइल रिचार्ज की नियमित आदतें बनाए रखें — स्थिर आदतें भरोसा बनाती हैं।"
    mr: "पुढील काही महिने तुमच्या बँकिंग, UPI आणि मोबाइल रिचार्जच्या नियमित सवयी कायम ठेवा — स्थिर सवयी विश्वास निर्माण करतात."
  plan_link:
    en: "Full plan: {url}"
    hi: "पूरी योजना: {url}"
    mr: "संपूर्ण योजना: {url}"
  product_labels:
    TWO_WHEELER: { en: "two-wheeler", hi: "दोपहिया वाहन", mr: "दुचाकी" }
    USED_CAR: { en: "used car", hi: "पुरानी कार", mr: "जुनी कार" }
    TRACTOR: { en: "tractor", hi: "ट्रैक्टर", mr: "ट्रॅक्टर" }
