    negative: { en: "Sales in only one harvest season", hi: "केवल एक फसल मौसम में बिक्री", mr: "फक्त एका पीक हंगामात विक्री" }
    action:
      en: "If possible, plan crops for more than one season so you have income at different times of the year."
      hi: "हो सके तो एक से ज़्यादा मौसम की फसल की योजना बनाएं ताकि साल में अलग-अलग समय आय आए।"
      mr: "शक्य असल्यास एकापेक्षा जास्त हंगामांसाठी पिकांचे नियोजन करा, म्हणजे वर्षात वेगवेगळ्या वेळी उत्पन्न मिळेल."
  RC028:
    feature: mandi_avg_monthly_settlement
    label: { en: "Average monthly mandi income", hi: "औसत मासिक मंडी आय", mr: "सरासरी मासिक मंडी उत्पन्न" }
    positive: { en: "Good average mandi income", hi: "मंडी से अच्छी औसत आय", mr: "मंडीतून चांगले सरासरी उत्पन्न" }
    negative: { en: "Low average mandi income", hi: "मंडी से औसत आय कम है", mr: "मंडीतून सरासरी उत्पन्न कमी आहे" }
    action:
      en: "Bring more of your produce to the registered mandi and keep the settlement slips."
      hi: "अपनी ज़्यादा उपज पंजीकृत मंडी में लाएं और भुगतान की पर्चियां संभालकर रखें।"
      mr: "तुमचा जास्त शेतमाल नोंदणीकृत मंडीत आणा आणि पेमेंटच्या पावत्या जपून ठेवा."
  RC029:
    feature: mandi_avg_settlement_delay
    label: { en: "Delay in receiving mandi payment", hi: "मंडी भुगतान में देरी", mr: "मंडी पेमेंट मिळण्यातील विलंब" }
    positive: { en: "Mandi payments arrive quickly", hi: "मंडी का भुगतान जल्दी मिलता है", mr: "मंडीचे पेमेंट लवकर मिळते" }
    negative: { en: "Mandi payments take long to arrive", hi: "मंडी का भुगतान मिलने में देर लगती है", mr: "मंडीचे पेमेंट मिळण्यास उशीर लागतो" }
    action:
      en: "Prefer buyers and commission agents who pay quickly, and keep a cash reserve for the waiting period."
      hi: "जल्दी भुगतान करने वाले खरीदारों और आढ़तियों को प्राथमिकता दें, और इंतज़ार के समय के लिए कुछ पैसे अलग रखें।"
      mr: "लवकर पेमेंट करणारे खरेदीदार आणि आडते निवडा आणि प्रतीक्षेच्या काळासाठी थोडी रक्कम राखीव ठेवा."
  RC030:
    feature: mandi_crop_diversity
    label: { en: "Variety of crops sold", hi: "बेची गई फसलों की विविधता", mr: "विकलेल्या पिकांची विविधता" }
    positive: { en: "Income from several different crops", hi: "कई अलग-अलग फसलों से आय", mr: "अनेक वेगवेगळ्या पिकांपासून उत्पन्न" }
    negative: { en: "Income depends on a single crop", hi: "आय केवल एक फसल पर निर्भर है", mr: "उत्पन्न फक्त एका पिकावर अवलंबून आहे" }
    action:
      en: "Consider growing one additional crop so a single bad season does not hurt your whole income."
      hi: "एक और फसल उगाने पर विचार करें ताकि एक खराब मौसम से पूरी आय प्रभावित न हो।"
      mr: "आणखी एक पीक घेण्याचा विचार करा, म्हणजे एका वाईट हंगामाचा संपूर्ण उत्पन्नावर परिणाम होणार नाही."
  RC031:
    feature: mandi_tenure_months
    label: { en: "Time selling at the mandi", hi: "मंडी में बिक्री का समय", mr: "मंडीत विक्रीचा कालावधी" }
    positive: { en: "Long record of selling at the mandi", hi: "मंडी में बिक्री का लंबा रिकॉर्ड", mr: "मंडीत विक्रीची दीर्घ नोंद" }
    negative: { en: "Short record of selling at the mandi", hi: "मंडी में बिक्री का रिकॉर्ड छोटा है", mr: "मंडीत विक्रीची नोंद कमी आहे" }
    action:
      en: "Keep selling through the registered mandi every season — a longer record builds your profile."
      hi: "हर मौसम में पंजीकृत मंडी के माध्यम से बेचते रहें — लंबा रिकॉर्ड आपकी प्रोफ़ाइल मज़बूत करता है।"
      mr: "प्रत्येक हंगामात नोंदणीकृत मंडीतून विक्री करत रहा — दीर्घ नोंद तुमची प्रोफाइल मजबूत करते."
  RC032:
    feature: requested_emi
    label: { en: "Requested EMI", hi: "मांगी गई EMI", mr: "मागितलेली EMI" }
    positive: { en: "The EMI is comfortable for your income", hi: "EMI आपकी आय के हिसाब से आरामदायक है", mr: "EMI तुमच्या उत्पन्नाच्या तुलनेत सोयीची आहे" }
    negative: { en: "The EMI is on the higher side", hi: "EMI कुछ ज़्यादा है", mr: "EMI थोडी जास्त आहे" }
    action:
      en: "Consider a lower-priced vehicle or a bigger down payment so the monthly EMI is smaller."
      hi: "कम कीमत का वाहन या ज़्यादा डाउन पेमेंट चुनें ताकि मासिक EMI कम हो।"
      mr: "कमी किमतीचे वाहन किंवा जास्त डाउन पेमेंट निवडा, म्हणजे मासिक EMI कमी होईल."
  RC033:
    feature: est_monthly_income
    label: { en: "Estimated monthly income", hi: "अनुमानित मासिक आय", mr: "अंदाजित मासिक उत्पन्न" }
    positive: { en: "Good estimated monthly income", hi: "अच्छी अनुमानित मासिक आय", mr: "चांगले अंदाजित मासिक उत्पन्न" }
    negative: { en: "Estimated monthly income is on the lower side", hi: "अनुमानित मासिक आय कम है", mr: "अंदाजित मासिक उत्पन्न कमी आहे" }
    action:
      en: "Make your earnings visible — use bank, UPI and GST/mandi records for all your income."
      hi: "अपनी कमाई दिखाएं — सारी आय के लिए बैंक, UPI और GST/मंडी रिकॉर्ड का उपयोग करें।"
      mr: "तुमची कमाई दिसू द्या — सर्व उत्पन्नासाठी बँक, UPI आणि GST/मंडी नोंदी वापरा."
  RC034:
    feature: emi_to_income_ratio
    label: { en: "EMI compared with income", hi: "आय के मुकाबले EMI", mr: "उत्पन्नाच्या तुलनेत EMI" }
    positive: { en: "EMI is a small part of your income", hi: "EMI आपकी आय का छोटा हिस्सा है", mr: "EMI हा तुमच्या उत्पन्नाचा छोटा भाग आहे" }
    negative: { en: "EMI takes a large part of your income", hi: "EMI आपकी आय का बड़ा हिस्सा लेती है", mr: "EMI तुमच्या उत्पन्नाचा मोठा भाग घेते" }
    action:
      en: "Choose a loan whose EMI is no more than about one-third of your monthly income."
      hi: "ऐसा लोन चुनें जिसकी EMI आपकी मासिक आय के लगभग एक-तिहाई से ज़्यादा न हो।"
      mr: "अशा कर्जाची निवड करा ज्याची EMI तुमच्या मासिक उत्पन्नाच्या सुमारे एक-तृतीयांशपेक्षा जास्त नसेल."
  RC035:
    feature: product_type_encoded
    reportable: false
    label: { en: "Type of loan", hi: "लोन का प्रकार", mr: "कर्जाचा प्रकार" }
    positive: { en: "Loan type suits your profile", hi: "लोन का प्रकार आपकी प्रोफ़ाइल के अनुकूल है", mr: "कर्जाचा प्रकार तुमच्या प्रोफाइलला अनुरूप आहे" }
    negative: { en: "Loan type is a stretch for your profile", hi: "लोन का प्रकार आपकी प्रोफ़ाइल के लिए ज़्यादा है", mr: "कर्जाचा प्रकार तुमच्या प्रोफाइलसाठी जास्त आहे" }
    action: { en: "Consider a smaller loan product.", hi: "छोटे लोन उत्पाद पर विचार करें।", mr: "लहान कर्ज उत्पादाचा विचार करा." }
  RC036:
    feature: ticket_size
